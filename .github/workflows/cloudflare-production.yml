name: Cloudflare production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-migrate-deploy-smoke:
    name: Verify, migrate D1, deploy, smoke
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AVAL_PRODUCTION_URL: ${{ vars.AVAL_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require deployment configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [[ "$AVAL_PRODUCTION_URL" == https://* ]] || { echo "::error::AVAL_PRODUCTION_URL must be an HTTPS production URL"; exit 1; }

      - run: npm ci
      # The root suite discovers desktop/test/, whose cases read the
      # electron-builder schema out of desktop's own dependencies.
      - run: npm ci --prefix desktop
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Apply additive migrations before the Worker writes the new tables.
      - name: Check authenticated smoke configuration
        env:
          AVAL_SMOKE_EMAIL: ${{ secrets.AVAL_SMOKE_EMAIL }}
          AVAL_SMOKE_PASSWORD: ${{ secrets.AVAL_SMOKE_PASSWORD }}
        run: |
          test -n "$AVAL_SMOKE_EMAIL" || { echo "::error::Missing AVAL_SMOKE_EMAIL for the dedicated verification account"; exit 1; }
          test -n "$AVAL_SMOKE_PASSWORD" || { echo "::error::Missing AVAL_SMOKE_PASSWORD for the dedicated verification account"; exit 1; }

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply aval-production --remote --config wrangler.deploy.jsonc

      - name: Deploy production Worker and cron
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Prove one authenticated live durable-agent run
        env:
          AVAL_SMOKE_EMAIL: ${{ secrets.AVAL_SMOKE_EMAIL }}
          AVAL_SMOKE_PASSWORD: ${{ secrets.AVAL_SMOKE_PASSWORD }}
        run: node scripts/smoke-durable-agent.mjs "$AVAL_PRODUCTION_URL"
