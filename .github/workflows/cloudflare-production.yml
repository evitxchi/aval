name: Cloudflare production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-migrate-deploy-smoke:
    name: Verify, migrate D1, deploy, smoke
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AVAL_PRODUCTION_URL: ${{ vars.AVAL_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Require deployment configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [[ "$AVAL_PRODUCTION_URL" == https://* ]] || { echo "::error::AVAL_PRODUCTION_URL must be an HTTPS production URL"; exit 1; }

      - run: npm ci
      # The root suite discovers desktop/test/, whose cases read the
      # electron-builder schema out of desktop's own dependencies.
      - run: npm ci --prefix desktop
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Apply additive migrations before the Worker writes the new tables.
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply aval-production --remote --config wrangler.deploy.jsonc

      - name: Prepare an isolated authenticated verification account
        env:
          AVAL_SMOKE_EMAIL: ${{ secrets.AVAL_SMOKE_EMAIL }}
          AVAL_SMOKE_PASSWORD: ${{ secrets.AVAL_SMOKE_PASSWORD }}
        run: node scripts/prepare-smoke-account.mjs

      - name: Deploy production Worker and cron
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Remove retired shared Anthropic secret
        run: |
          set -euo pipefail
          if npx wrangler secret list --config wrangler.deploy.jsonc | jq -e '.[] | select(.name == "ANTHROPIC_API_KEY")' >/dev/null; then
            npx wrangler secret delete ANTHROPIC_API_KEY --config wrangler.deploy.jsonc
          fi

      - name: Verify authenticated production readiness without a model call
        env:
          AVAL_SMOKE_CREDENTIALS_FILE: ${{ runner.temp }}/aval-smoke-credentials.json
        run: node scripts/smoke-production-readiness.mjs "$AVAL_PRODUCTION_URL"

      - name: Remove temporary verification credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/aval-smoke-credentials.json" "$RUNNER_TEMP/aval-smoke-account.sql"
